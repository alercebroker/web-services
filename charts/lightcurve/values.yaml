# Default values for step_starter.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

namespace: lightcurve

image:
  repository: ghcr.io/alercebroker/lightcurve
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  # Immutable pin. When set (e.g. "sha256:..."), the image is referenced by
  # digest (repository@digest) and `tag` is ignored. Empty = use tag.
  digest: ""

# App-container health probes (target the app on :8000). Empty {} = no probe
# (preserves current behavior for services that don't set them).
startupProbe: {}
livenessProbe: {}
readinessProbe: {}

imagePullSecrets:
  - name: "image-pull-access"
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

service:
  type: ClusterIP
  port: 8000

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
          - matchExpressions:
            - key: eks.amazonaws.com/nodegroup
              operator: In
              ## Override this value with the NodeGroup tag accordingly
              values: []

# Soft (preferred) anti-affinity so a release's replicas spread across nodes
# instead of stacking on one. Merged into `affinity` above when enabled.
podAntiAffinity:
  enabled: false

nameOverride: ""

configmap:
  port: ""
  apiUrl: ""
  service: ""
  # Full nginx server block for the sidecar. Empty = the chart's default
  # (vanilla) config. Set this to ship the hardened upstream/keepalive config.
  nginxConf: ""

ingress:
  certificateArn: ""
  host: ""
  k8sGroupName: ""
  k8sTags: ""
  path: "" # path without end /

secrets:
  secretKey: ""
  sql:
    host: ""
    database: ""
    user: ""
    password: ""
    port: ""
  mongo:
    host: ""
    database: ""
    authSource: ""
    user: ""
    password: ""
    port: ""    

imageCredentials:
  registry: ""
  username: ""
  password: ""
  email: ""
