# Default values for step_starter.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

namespace: alerts-api

image:
  repository: ghcr.io/alercebroker/alerts-api
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  # Immutable pin. When set (e.g. "sha256:..."), the image is referenced by
  # digest (repository@digest) and `tag` is ignored. Empty = use tag.
  digest: ""

# App-container health probes. NOTE: this app listens on :5000 (not :8000 like
# the lightcurve chart). Empty {} = no probe, preserving current behavior for
# any release that doesn't set them.
startupProbe: {}
livenessProbe: {}
readinessProbe: {}

imagePullSecrets:
  - name: "image-pull-access"
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

service:
  port: ""

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
          - matchExpressions:
            - key: eks.amazonaws.com/nodegroup
              operator: In
              ## Override this value with the NodeGroup tag accordingly
              values: []

# Soft (preferred) anti-affinity so a release's replicas spread across nodes
# instead of stacking on one. Merged into `affinity` above when enabled.
podAntiAffinity:
  enabled: false

# Node spreading, complementing podAntiAffinity. The anti-affinity preference
# alone proved too weak: at 512Mi requests the scheduler's least-allocated
# scoring dominated it and stacked 10 of 16 replicas onto one nearly-empty node.
# whenUnsatisfiable stays ScheduleAnyway on purpose -- DoNotSchedule would let
# pods go Pending under node pressure and block HPA scale-up, which is the worst
# time to lose capacity. Inert unless enabled.
topologySpread:
  enabled: false
  maxSkew: 2
  whenUnsatisfiable: ScheduleAnyway

configmap:
  port: ""
  apiUrl: ""
  appWorkers: ""
  threads: ""
  logLevel: ""
  # Full nginx server block for the sidecar. Empty = the chart's default
  # (vanilla) config. Set this to ship the hardened upstream/keepalive config.
  nginxConf: ""

ingress:
  certificateArn: ""
  host: ""
  k8sGroupName: ""
  k8sTags: ""

secrets:
  secretKey: ""
  sql:
    host: ""
    database: ""
    user: ""
    password: ""
    port: ""
  mongo:
    host: ""
    database: ""
    authSource: ""
    user: ""
    password: ""
    port: ""
  secretKey: ""

imageCredentials:
  registry: ""
  username: ""
  password: ""
  email: ""
