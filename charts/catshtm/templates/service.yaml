apiVersion: v1
kind: Service
metadata:
  name: {{ include "catshtm-api.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "catshtm-api.labels" . | nindent 4 }}
  annotations:
    # answered by nginx (see configmap-nginx.yaml), not by the app
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    {{- include "catshtm-api.selectorLabels" . | nindent 4 }}
